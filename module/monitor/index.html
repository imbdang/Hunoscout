<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="icon" href="/clawd/stop.svg">
<title>Hunoscout Monitor</title>
<!-- Bố cục theo Claude-Code-Agent-Monitor (github.com/hoangsonww/Claude-Code-Agent-Monitor, MIT); nền tối aurora + kính mờ, nhấn dải chàm → hồng tím.
     Icon: Tabler Icons (MIT). Font: Inter / JetBrains Mono. -->
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@3.50.0/dist/tabler-icons.min.css">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap">
<style>
  :root {
    color-scheme: dark;
    /* nền gần đen ngả tím + kính mờ */
    --bg:#07060d; --side-bg:rgba(10,9,18,.72); --glass:rgba(255,255,255,.028); --glass2:rgba(255,255,255,.055); --solid:#100e1a;
    --line:rgba(255,255,255,.07); --line2:rgba(255,255,255,.11); --line3:rgba(255,255,255,.18);
    --t1:#eeedf7; --t2:#bbb8cf; --t3:#8b88a3; --t4:#5f5c76;
    /* nhấn: dải chàm → tím → hồng tím */
    --grad:linear-gradient(90deg, #818cf8, #a78bfa 50%, #e879f9);
    --violet:#a78bfa; --violet-bg:rgba(167,139,250,.1); --violet-bd:rgba(167,139,250,.26);
    /* trạng thái */
    --pass:#67e8f9; --fail:#fb7185; --amber:#fbbf24; --gray:#77748c;
    --claude:#d97757; --claude2:#f3b08f;
    --sans:"Inter", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    --mono:"JetBrains Mono", ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    --side:240px; --side-c:68px; --drawer:min(720px, 46vw);
  }
  * { box-sizing:border-box; scrollbar-width:thin; scrollbar-color:var(--line3) transparent; }
  html, body { margin:0; height:100%; }
  body { display:flex; background:var(--bg); color:var(--t1); font:14px/1.5 var(--sans); overflow:hidden; -webkit-font-smoothing:antialiased; }
  /* aurora: 3 quầng màu mờ trôi rất chậm phía sau */
  body::before { content:""; position:fixed; inset:-20%; z-index:0; pointer-events:none;
    background:radial-gradient(38% 34% at 80% 10%, rgba(124,58,237,.2), transparent 70%),
      radial-gradient(32% 30% at 14% 34%, rgba(192,38,211,.1), transparent 70%),
      radial-gradient(40% 34% at 58% 104%, rgba(14,116,144,.14), transparent 70%);
    animation:drift 48s ease-in-out infinite alternate; }
  @keyframes drift { to { transform:translate3d(-4%, 3%, 0) rotate(7deg); } }
  @media (prefers-reduced-motion:reduce) { body::before { animation:none; } }
  ::selection { background:rgba(167,139,250,.3); }
  button, select { font:inherit; color:inherit; }
  i.ti { font-size:16px; line-height:1; }
  .mono { font-family:var(--mono); font-size:12px; }
  .muted { color:var(--t3); }
  .ok { color:var(--pass); } .bad { color:var(--fail); }

  /* ---- nút / badge ---- */
  .btn { display:inline-flex; align-items:center; gap:7px; height:32px; padding:0 12px; border-radius:8px; cursor:pointer;
    border:1px solid var(--line2); background:var(--glass); color:var(--t1); font-size:13px; white-space:nowrap; transition:background .15s, border-color .15s; }
  .btn:hover { background:var(--glass2); border-color:var(--line3); }
  .btn.ghost { background:transparent; border-color:transparent; color:var(--t2); }
  .btn.ghost:hover { background:var(--glass2); color:var(--t1); }
  .btn.icon { width:32px; padding:0; justify-content:center; }
  .btn.sm { height:28px; padding:0 10px; font-size:12.5px; }
  .seg { display:inline-flex; gap:2px; padding:2px; border-radius:9px; background:var(--glass); border:1px solid var(--line2); }
  .seg-b { display:inline-flex; align-items:center; gap:7px; height:28px; padding:0 12px; border-radius:7px; border:0; background:none;
    color:var(--t3); cursor:pointer; font-size:13px; transition:.15s; }
  .seg-b:hover { color:var(--t1); }
  .seg-b.active { background:var(--violet-bg); color:#ddd6fe; box-shadow:inset 0 0 0 1px var(--violet-bd); }
  .badge { --c:var(--t3); display:inline-flex; align-items:center; gap:6px; height:20px; padding:0 8px; border-radius:99px; white-space:nowrap;
    font-size:11.5px; font-weight:500; color:var(--c); border:1px solid color-mix(in srgb, var(--c) 30%, transparent);
    background:color-mix(in srgb, var(--c) 9%, transparent); }
  .b-cyan { --c:var(--pass); } .b-rose { --c:var(--fail); } .b-amber { --c:var(--amber); } .b-gray { --c:#a3a0b8; }
  .dot { width:6px; height:6px; border-radius:50%; background:currentColor; flex:none; }
  .dot.pulse { animation:pulse 2s cubic-bezier(.4,0,.6,1) infinite; }
  @keyframes pulse { 50% { opacity:.35; } }
  /* viền dải màu (logo, card đang xem) */
  .gborder { border:1px solid transparent !important;
    background:linear-gradient(var(--solid), var(--solid)) padding-box, linear-gradient(135deg, #818cf8, #e879f9) border-box !important; }

  /* ---- sidebar ---- */
  aside { position:relative; z-index:1; width:var(--side); flex:none; display:flex; flex-direction:column; overflow:hidden;
    background:var(--side-bg); backdrop-filter:blur(16px); border-right:1px solid var(--line); transition:width .2s ease; }
  .brand { display:flex; align-items:center; gap:12px; padding:16px; border-bottom:1px solid var(--line); }
  .logo { width:38px; height:38px; flex:none; border-radius:10px; display:flex; align-items:center; justify-content:center;
    box-shadow:0 0 24px -8px rgba(167,139,250,.6); }
  .brand b { display:block; font-size:14px; font-weight:600; line-height:1.25; background:var(--grad); -webkit-background-clip:text; background-clip:text; color:transparent; }
  .brand small { display:block; font-size:12px; color:var(--t3); }
  #tree { flex:1; overflow:auto; padding:8px 10px 16px; }
  .grp { display:flex; align-items:center; gap:7px; padding:12px 8px 6px; font:500 11px var(--mono); letter-spacing:.06em;
    text-transform:uppercase; color:var(--t3); }
  .dev { padding:2px 8px 4px; font-size:12px; color:var(--t3); }
  .nav { display:flex; align-items:center; gap:9px; margin:1px 0; padding:7px 9px; border-radius:8px; border:1px solid transparent; cursor:pointer;
    font-size:13px; color:var(--t2); transition:background .15s, color .15s, border-color .15s; }
  .nav:hover { background:var(--glass2); color:var(--t1); }
  .nav.active { background:var(--violet-bg); border-color:var(--violet-bd); color:#ddd6fe; }
  .nav .r { margin-left:auto; font-size:12px; color:var(--t3); }
  .nav.empty-run { cursor:default; color:var(--t3); }
  .nav i.s-running { color:var(--amber); } .nav i.s-done { color:var(--pass); } .nav i.s-stopped { color:var(--t3); }
  .side-foot { padding:12px; border-top:1px solid var(--line); display:grid; gap:8px; }
  .livebox { display:flex; align-items:center; gap:8px; padding:8px 10px; border-radius:8px; border:1px solid var(--line); background:var(--glass);
    font-size:13px; color:var(--t2); }
  .livebox .dot { color:var(--pass); box-shadow:0 0 8px rgba(103,232,249,.7); }
  .livebox.off .dot { color:var(--fail); box-shadow:none; animation:none; }
  .livebox #clock { margin-left:auto; color:var(--t3); }
  #root { font:11px var(--mono); color:var(--t4); padding:0 4px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .collapse { display:flex; align-items:center; justify-content:center; gap:8px; height:34px; border-radius:8px; cursor:pointer;
    border:1px solid var(--line); background:transparent; color:var(--t3); font:500 11px var(--mono); letter-spacing:.06em; text-transform:uppercase; }
  .collapse:hover { background:var(--glass2); color:var(--t1); }
  /* sidebar thu gọn: dải icon — chỉ còn logo, icon lượt chạy (màu theo trạng thái), chấm Live, nút mở */
  body.collapsed aside { width:var(--side-c); }
  body.collapsed .brand { justify-content:center; padding:16px 0; }
  body.collapsed :is(.brand > div:last-child, .grp, .dev, .nav > :not(i), .empty-run, #root, .lt, #clock) { display:none; }
  body.collapsed .nav { justify-content:center; padding:10px 0; }
  body.collapsed .livebox { justify-content:center; padding:10px 0; }

  /* ---- vùng chính ---- */
  main { position:relative; z-index:1; flex:1; overflow:auto; min-width:0; padding:20px 20px 60px; transition:padding-right .28s ease; }
  @media (min-width:1024px) { main { padding:28px 32px 60px; } }
  @media (min-width:1280px) { body.drawer main { padding-right:calc(var(--drawer) + 32px); } }
  .ph { display:flex; align-items:flex-start; gap:14px; flex-wrap:wrap; margin-bottom:24px; }
  .ph-icon { width:42px; height:42px; flex:none; border-radius:10px; display:flex; align-items:center; justify-content:center;
    background:var(--glass); border:1px solid var(--line2); color:var(--violet); }
  .ph-icon i.ti { font-size:20px; }
  .ph-main { min-width:0; flex:1 1 360px; }
  .ph-main h1 { margin:0; font-size:20px; font-weight:600; color:var(--t1); letter-spacing:-.01em; display:flex; align-items:center; gap:10px; flex-wrap:wrap; }
  .ph-main .sub { margin-top:4px; display:flex; gap:16px; flex-wrap:wrap; font-size:13px; color:var(--t3); }
  .ph-main .sub span { display:inline-flex; align-items:center; gap:6px; }
  .ph-act { display:flex; gap:8px; align-items:center; margin-left:auto; }

  .card { background:var(--glass); border:1px solid var(--line); border-radius:12px; backdrop-filter:blur(14px);
    box-shadow:inset 0 1px 0 rgba(255,255,255,.04); transition:border-color .15s, background .15s; }
  .stats, #grid { display:grid; grid-template-columns:1fr; gap:12px; }
  @media (min-width:768px) { .stats, #grid { grid-template-columns:repeat(2, 1fr); } }
  @media (min-width:1024px) { .stats, #grid { grid-template-columns:repeat(3, 1fr); } }
  .stat { padding:16px 18px; }
  .stat:hover { border-color:var(--line2); }
  .stat .k { display:flex; align-items:center; justify-content:space-between; gap:8px; margin-bottom:10px;
    font:500 11px var(--mono); letter-spacing:.06em; text-transform:uppercase; color:var(--t3); }
  .stat .k i.ti { font-size:17px; color:var(--t4); }
  .stat .v { display:flex; align-items:flex-end; gap:8px; font-size:24px; font-weight:600; color:var(--t1); line-height:1.1; font-variant-numeric:tabular-nums; }
  .stat .v small { font-size:12px; font-weight:400; color:var(--t3); margin-bottom:3px; }
  .bar { height:4px; border-radius:99px; background:var(--line2); margin-top:12px; overflow:hidden; }
  .bar > div { height:100%; border-radius:99px; background:var(--grad); box-shadow:0 0 10px rgba(167,139,250,.5); }
  .quote { --c:var(--t2); margin-top:16px; padding:1px 0 1px 14px; border-left:2px solid var(--line3); color:var(--t2); font-size:13.5px; line-height:1.6; }
  .quote .qt { display:flex; align-items:center; gap:7px; margin-bottom:2px; color:var(--c); font-weight:500; font-size:13px; }
  .quote.b-cyan { --c:var(--pass); } .quote.b-rose { --c:var(--fail); } .quote.b-amber { --c:var(--amber); } .quote.b-gray { --c:#a3a0b8; }
  section.card { margin-top:16px; }
  .card-h { display:flex; align-items:center; gap:9px; padding:14px 18px 0; }
  .card-h > i.ti { color:var(--violet); }
  .card-t { font-size:14px; font-weight:600; color:var(--t1); }
  .card-d { font-size:13px; color:var(--t3); }
  .card-a { margin-left:auto; display:flex; gap:6px; align-items:center; }
  .card-b { padding:14px 18px 18px; }
  /* song song: mỗi case đang mở 1 làn trên trục giờ chung — trên: tài nguyên giữ (claims), dưới: các bước đã làm + đoạn chờ */
  #par.hide { display:none; } #par .card-t { white-space:nowrap; }
  #par .card-d { white-space:nowrap; overflow:hidden; text-overflow:ellipsis; min-width:0; }
  .plg { display:flex; gap:12px; flex-wrap:wrap; align-items:center; font:11.5px var(--sans); color:var(--t3); }
  .plg span { display:inline-flex; align-items:center; gap:5px; }
  .plg .sw { width:10px; height:10px; border-radius:3px; background:color-mix(in srgb, var(--c) 30%, transparent); border:1px solid var(--c); }
  .pgrid { position:relative; display:grid; grid-template-columns:minmax(150px, 21%) 1fr; column-gap:12px; }
  .pin { position:absolute; inset:0 20px; }
  .pax { grid-column:2; position:relative; height:24px; }
  .ptick { position:absolute; top:3px; transform:translateX(-50%); font:11px var(--mono); color:var(--t4); white-space:nowrap; }
  .pov { grid-column:2; grid-row:1 / -1; position:absolute; inset:0; pointer-events:none; }
  .pov.top { z-index:3; }
  .pgl { position:absolute; top:22px; bottom:0; width:1px; background:var(--line); }
  .ppast { position:absolute; left:0; top:22px; bottom:0; background:rgba(255,255,255,.018); border-radius:6px 0 0 6px; }
  .pnow { position:absolute; top:22px; bottom:0; width:2px; margin-left:-1px; background:var(--fail); box-shadow:0 0 8px rgba(251,113,133,.5); }
  .pnowl { position:absolute; top:0; transform:translateX(-50%); padding:1px 7px; border-radius:99px; background:var(--fail);
    color:#1a0a10; font:600 10.5px/16px var(--mono); white-space:nowrap; }
  .plab { grid-column:1; min-width:0; padding:9px 0 9px 12px; border-top:1px solid var(--line); border-left:2px solid transparent; cursor:pointer; }
  .plab.cur { border-left-color:var(--amber); background:linear-gradient(90deg, rgba(251,191,36,.08), transparent 80%); }
  .plab .l1 { display:flex; gap:8px; align-items:baseline; min-width:0; }
  .plab .id { font:600 12.5px var(--mono); color:var(--t1); flex:none; } .plab.cur .id { color:var(--amber); }
  .plab .t { color:var(--t2); font-size:12.5px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .plab .l2 { margin-top:4px; font-size:11.5px; color:var(--t3); display:flex; gap:5px; align-items:center; white-space:nowrap; overflow:hidden; }
  .plab .l2 b { color:var(--t1); font-weight:500; } .plab .l2 .ti { font-size:13px; }
  .plab .l2.busy { color:var(--amber); } .plab .l2.wait { color:var(--violet); } .plab .l2.fail { color:var(--fail); }
  .plane { grid-column:2; position:relative; min-height:60px; border-top:1px solid var(--line); cursor:pointer; }
  .plane:hover, .plab:hover { background-color:rgba(255,255,255,.02); }
  .pbar { --c:var(--t3); position:absolute; top:10px; height:24px; border-radius:5px; padding:0 7px; font:500 11px/22px var(--sans);
    color:var(--t1); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; min-width:6px;
    background:color-mix(in srgb, var(--c) 22%, transparent); border:1px solid color-mix(in srgb, var(--c) 70%, transparent); }
  .pbar small { color:var(--t2); font:10.5px var(--mono); margin-left:4px; }
  .pbar.sm { padding:0 3px; text-align:center; } .pbar.sm small { margin:0; font-size:10px; }
  .phd { grid-column:1; grid-row:1; padding:4px 0 0 14px; font:10.5px var(--mono); letter-spacing:.06em; text-transform:uppercase; color:var(--t4); }
  .plg .pwk { width:14px; border-top:2px dashed var(--violet); }
  .pbar.open { border-right:0; border-radius:5px 0 0 5px; background:linear-gradient(90deg, color-mix(in srgb, var(--c) 22%, transparent) 60%, transparent); }
  .pbar.live { box-shadow:0 0 0 1px var(--c), 0 0 10px color-mix(in srgb, var(--c) 45%, transparent); }
  .pbar.open.live { box-shadow:none; border-color:var(--c); }
  .r-power { --c:var(--amber); } .r-quick { --c:var(--violet); } .r-cycle { --c:var(--fail); } .r-timers { --c:var(--pass); }
  .r-lock { --c:var(--claude); } .r-press { --c:#818cf8; } .r-inputs { --c:#e879f9; } .r-neo { --c:var(--claude2); }
  .plife { position:absolute; top:var(--y, 43px); height:2px; border-radius:2px; background:linear-gradient(90deg, var(--line2), var(--line3)); }
  .plife::before { content:""; position:absolute; left:-4px; top:-3px; width:6px; height:6px; border-radius:50%; border:1.5px solid var(--t3); background:var(--solid); }
  .pbusy { position:absolute; top:calc(var(--y, 43px) + 1px); width:10px; height:10px; margin:-5px 0 0 -5px; border-radius:50%;
    background:var(--amber); animation:ring 1.6s ease-out infinite; }
  .pwl { position:absolute; top:var(--y, 43px); height:0; border-top:2px dashed var(--violet); opacity:.8; }
  .pfl { position:absolute; top:calc(var(--y, 43px) + 1px); transform:translate(-50%, -50%); width:18px; height:18px; border-radius:50%; display:grid; place-items:center;
    background:var(--violet-bg); border:1px solid var(--violet-bd); color:var(--violet); font-size:11px; }
  .pfoot { font-size:12px; color:var(--t2); margin-top:10px; display:flex; gap:6px; align-items:center; }

  /* ---- thanh (rail) ---- */
  .rail { position:relative; margin:0 26px; }
  .rail .track, .rail .fill { position:absolute; left:0; height:2px; border-radius:2px; }
  .rail .track { right:0; background:var(--line2); }
  .rail .fill { background:var(--grad); box-shadow:0 0 8px rgba(167,139,250,.55); transition:width .9s cubic-bezier(.4,.1,.2,1); }
  .stn { position:absolute; transform:translate(-50%, -50%); border-radius:50%; cursor:pointer; background:var(--solid);
    border:2px solid var(--line3); box-shadow:0 0 0 3px var(--solid); transition:.2s; }
  .stn:hover { border-color:var(--t2); }
  .stn.PASS, .stn.done { background:var(--pass); border-color:var(--pass); }
  .stn.FAIL, .stn.failed { background:var(--fail); border-color:var(--fail); }
  .stn.BLOCKED { background:var(--gray); border-color:var(--gray); }
  .stn.NEED-REVIEW { background:var(--amber); border-color:var(--amber); }
  .stn.cur { border-color:var(--amber); background:var(--solid); animation:ring 1.4s infinite; }
  .stn.focus { outline:1.5px solid var(--violet); outline-offset:3px; }
  .stn.flag { border-radius:4px; }
  @keyframes ring { 0% { box-shadow:0 0 0 3px var(--solid), 0 0 0 3px rgba(251,191,36,.45); } 100% { box-shadow:0 0 0 3px var(--solid), 0 0 0 12px rgba(251,191,36,0); } }
  .lbl { position:absolute; transform:translateX(-50%); text-align:center; pointer-events:none; }

  #mission .rail { height:96px; }
  #mission .track, #mission .fill { top:66px; }
  #mission .stn { top:67px; width:13px; height:13px; }
  #mission .lbl { top:82px; font:10.5px var(--mono); color:var(--t3); }
  #mission .lbl.cur { color:var(--amber); }
  /* nhiều case (trạm sát nhau) → mỗi trạm 1 vạch mảnh, không đè nhau; case đang chạy = vạch cao vàng */
  #mission .rail.dense .stn { width:var(--sw); height:12px; border-radius:2px; border:0; box-shadow:none; }
  #mission .rail.dense .stn:not(.PASS):not(.FAIL):not(.BLOCKED):not(.NEED-REVIEW):not(.cur) { background:var(--line3); }
  #mission .rail.dense .stn:hover { filter:brightness(1.4); }
  #mission .rail.dense .stn.cur { height:22px; background:var(--amber); animation:none; box-shadow:0 0 8px rgba(251,191,36,.7); }
  #mission .rail.dense .stn.flag { width:12px; height:12px; border:1.5px solid var(--line3); }
  #mission .rail.dense .track { display:none; }

  /* stage: chừa chỗ trên thanh cho Clawd khi case đang chạy; không chạy → thu lại */
  #stage .rail { --off:168px; height:calc(var(--off) + 84px); margin:0 70px; }
  #stage .rail.noagent { --off:24px; }
  #stage .track, #stage .fill { top:var(--off); }
  #stage .stn { top:calc(var(--off) + 1px); width:22px; height:22px; display:flex; align-items:center; justify-content:center;
    font:600 10px var(--mono); color:#0b0a12; }
  #stage .stn:not(.done):not(.failed):not(.cur):not(.PASS):not(.FAIL):not(.BLOCKED):not(.NEED-REVIEW) { color:var(--t3); }
  #stage .stn.cur { color:var(--amber); }
  #stage .lbl { top:calc(var(--off) + 20px); width:var(--lw, 132px); font-size:12.5px; line-height:1.35; color:var(--t2); }
  #stage .lbl .d { display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden; }
  #stage .lbl .tool { display:block; margin-top:3px; font:11px var(--mono); color:var(--t4); }
  .stagehead { display:flex; gap:10px; align-items:center; flex-wrap:wrap; }
  .stagehead .id { font:500 13px var(--mono); color:var(--t3); }
  .stagehead .t { font-size:15px; font-weight:600; color:var(--t1); }
  .stagefoot { display:flex; gap:18px; flex-wrap:wrap; color:var(--t3); font-size:12.5px; }
  .stagefoot span { display:inline-flex; align-items:center; gap:6px; }
  .stagefoot .evt { color:var(--amber); }

  /* ---- agent ---- */
  .agent { position:absolute; top:0; transform:translateX(-50%); transition:left .9s cubic-bezier(.4,.1,.2,1); pointer-events:none; z-index:2; }
  .agent.hide { display:none; }
  /* Clawd: 8 ảnh chồng nhau, chỉ hiện ảnh của tâm trạng hiện tại (walk đè lên khi đang trượt); không tâm trạng → idle */
  .pet { position:relative; }
  .pet img { position:absolute; display:none; max-width:none; margin:0; }
  .pet img.idle { display:block; }
  .agent:is(.walk,.work,.wait,.fix,.fail,.done,.stop) .pet img.idle { display:none; }
  .agent.walk img.walk, .agent.work:not(.walk) img.work, .agent.wait:not(.walk) img.wait, .agent.fix:not(.walk) img.fix,
  .agent.fail:not(.walk) img.fail, .agent.done:not(.walk) img.done, .agent.stop:not(.walk) img.stop { display:block; }
  #mAgent { top:auto; bottom:36px; } #sAgent { top:auto; bottom:94px; }   /* đặt theo chân: chân Clawd đứng ngay trên chấm của thanh */
  .bubble { position:absolute; left:calc(100% + 6px); top:2px; white-space:nowrap; max-width:380px; overflow:hidden; text-overflow:ellipsis;
    padding:4px 10px; border-radius:9px 9px 9px 2px; background:rgba(20,17,33,.92); border:1px solid var(--violet-bd); font-size:12px; color:var(--t1); }
  .agent.flip .bubble { left:auto; right:calc(100% + 6px); border-radius:9px 9px 2px 9px; }
  .agent.mini .bubble { top:-2px; font-size:11.5px; padding:3px 8px; max-width:240px; }
  .nametag { position:absolute; left:50%; transform:translateX(-50%); bottom:100%; margin-bottom:2px;
    font:600 9px var(--mono); letter-spacing:.2em; color:var(--claude2); }

  /* ---- lưới testcase ---- */
  .sec { display:flex; align-items:center; gap:9px; margin:32px 0 12px; }
  .sec > i.ti { color:var(--violet); }
  .tc { padding:14px 16px 10px; cursor:pointer; }
  .tc:hover { border-color:var(--line3); background:var(--glass2); }
  .tc.cur { border-color:rgba(251,191,36,.4); }
  .tc .top { display:flex; align-items:center; gap:8px; }
  .tc .id { font:500 12px var(--mono); color:var(--t3); }
  .tc .g { display:inline-flex; align-items:center; gap:5px; font-size:12px; color:var(--t4); overflow:hidden; white-space:nowrap; text-overflow:ellipsis; }
  .tc .top .badge { margin-left:auto; }
  .tc .t { margin-top:8px; color:var(--t1); font-size:13.5px; display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical;
    overflow:hidden; min-height:40px; }
  .rail.tiny { height:34px; margin:2px 8px 0; }
  .tiny .track, .tiny .fill { top:24px; height:2px; }
  .tiny .fill { box-shadow:none; }
  .tiny .stn { top:25px; width:8px; height:8px; border-width:1.5px; box-shadow:none; cursor:inherit; }
  .tiny .agent { top:auto; bottom:14px; }

  /* ---- drawer ---- */
  #drawer { position:fixed; top:0; right:0; bottom:0; width:var(--drawer); min-width:380px; display:flex; flex-direction:column;
    background:rgba(9,8,16,.9); backdrop-filter:blur(18px); border-left:1px solid var(--line2); box-shadow:-16px 0 40px rgba(0,0,0,.5);
    transform:translateX(104%); transition:transform .28s ease; z-index:6; }
  body.drawer #drawer { transform:none; }
  .dhead { display:flex; align-items:flex-end; gap:4px; padding:8px 14px 0; border-bottom:1px solid var(--line); }
  .tab { position:relative; display:inline-flex; align-items:center; gap:7px; padding:10px 12px; border:0; background:none;
    color:var(--t3); cursor:pointer; font-size:13.5px; }
  .tab:hover { color:var(--t1); }
  .tab.active { color:var(--t1); }
  .tab.active::after { content:""; position:absolute; left:8px; right:8px; bottom:-1px; height:2px; border-radius:2px; background:var(--grad); }
  .dhead .btn { margin:0 0 6px auto; }
  .dtools { display:flex; gap:10px; align-items:center; padding:9px 14px; border-bottom:1px solid var(--line); color:var(--t3); font-size:13px; }
  .select { height:30px; padding:0 10px; border-radius:8px; border:1px solid var(--line2); background:var(--solid); }
  .switch { display:inline-flex; align-items:center; gap:8px; margin-left:auto; cursor:pointer; }
  .switch input { appearance:none; width:30px; height:17px; margin:0; border-radius:99px; background:var(--line3); position:relative; cursor:pointer; transition:.2s; }
  .switch input::after { content:""; position:absolute; top:2px; left:2px; width:13px; height:13px; border-radius:50%; background:var(--t2); transition:.2s; }
  .switch input:checked { background:var(--grad); } .switch input:checked::after { left:15px; background:#fff; }
  #dbody { flex:1; overflow:auto; padding:14px 16px 30px; }
  .detail h4 { margin:18px 0 6px; font:500 11px var(--mono); letter-spacing:.06em; text-transform:uppercase; color:var(--t3); }
  .detail ol, .detail ul { margin:0; padding-left:20px; color:var(--t2); }
  .detail li { margin:3px 0; }
  .tbl { border-collapse:collapse; width:100%; margin-top:8px; font-size:13px; }
  .tbl td, .tbl th { border-bottom:1px solid var(--line); padding:7px 8px; vertical-align:top; text-align:left; }
  .tbl th { color:var(--t3); font-weight:500; }
  .chip { font:11px var(--mono); padding:1px 7px; border-radius:5px; background:var(--glass2); border:1px solid var(--line2); color:var(--t2); white-space:nowrap; }
  .st { border:1px solid var(--line); border-radius:10px; margin:8px 0; padding:9px 11px; background:var(--glass); }
  .st.failed { border-color:rgba(251,113,133,.35); }
  .st .h { display:flex; gap:8px; align-items:center; flex-wrap:wrap; }
  .st .time { color:var(--t3); } .st .tool { font-weight:600; color:#c4b5fd; }
  .st .args { color:var(--t3); overflow:hidden; text-overflow:ellipsis; white-space:nowrap; max-width:360px; }
  .route { color:var(--t3); font-size:11px; margin-top:3px; }
  .evt { color:var(--amber); font-size:12px; margin-top:3px; }
  .res { margin-top:5px; white-space:pre-wrap; word-break:break-word; color:var(--t2); max-height:150px; overflow:auto; }
  .obs { margin-top:4px; } .obs summary { cursor:pointer; color:var(--t3); font-size:12px; }
  .shot { margin-top:6px; } .shot img { height:150px; border-radius:8px; border:1px solid var(--line2); cursor:zoom-in; }
  .note { margin:8px 0; padding:6px 11px; border-left:2px solid var(--claude); color:var(--t2); }
  .sep { margin:16px 0 6px; display:flex; align-items:center; gap:8px; color:var(--t3); font-size:12px; }
  .sep::after { content:""; flex:1; border-top:1px solid var(--line); }
  .empty { padding:36px 20px; text-align:center; color:var(--t3); }

  #modal { position:fixed; inset:0; background:rgba(4,3,9,.78); backdrop-filter:blur(6px); display:none; align-items:center; justify-content:center; z-index:9; }
  #modal img { max-height:94vh; max-width:94vw; border-radius:10px; }
  #modal pre { background:var(--solid); border:1px solid var(--line2); padding:18px; border-radius:12px; max-width:900px; max-height:88vh;
    overflow:auto; white-space:pre-wrap; font:12.5px/1.6 var(--mono); color:var(--t2); }
  @media (max-width:900px) {
    #drawer { width:100vw; min-width:0; } .rail { margin:0 14px; } #stage .rail { margin:0 30px; }
  }

  }
</style>
</head>
<body>
<aside>
  <div class="brand"><div class="logo gborder" id="logo"></div><div><b>Hunoscout</b><small>Test Monitor</small></div></div>

</aside>
<main>
  <div class="ph">
    <div class="ph-icon"><i class="ti ti-layout-dashboard"></i></div>
    <div class="ph-main" id="phTitle"><h1>Chọn một lượt chạy</h1><div class="sub">Danh sách phiên ở cột bên trái.</div></div>
    <div class="ph-act">
      <div class="seg"><button class="seg-b" id="detailBtn"><i class="ti ti-file-text"></i><span class="lab">Chi tiết</span></button>
        <button class="seg-b" id="logBtn"><i class="ti ti-list-details"></i><span class="lab">Log</span></button></div>
      <button class="btn ghost" id="reportBtn"><i class="ti ti-report-analytics"></i><span class="lab">Báo cáo</span></button>
    </div>
  </div>
  <div class="stats" id="stats"></div>
  <div id="summary"></div>
  <section class="card" id="mission">
    <div class="card-h"><i class="ti ti-route"></i><span class="card-t">Mission</span><span class="card-d">các testcase của lượt chạy</span>
      <span class="card-a mono muted" id="missionInfo"></span></div>
    <div class="card-b"><div class="rail"><div class="track"></div><div class="fill" id="mFill"></div><div id="mStations"></div>
      <div class="agent mini hide" id="mAgent"></div></div></div>
  </section>
  <section class="card hide" id="par">
    <div class="card-h"><i class="ti ti-arrows-split"></i><span class="card-t">Song song</span><span class="card-d">tài nguyên mỗi case giữ theo giờ</span>

        <button class="btn sm" id="stageLog"><i class="ti ti-list-details"></i>Log case</button></span></div>

      <div id="sHead"></div>
      <div class="rail"><div class="track"></div><div class="fill" id="sFill"></div><div id="sStations"></div>

<div id="drawer">
  <div class="dhead">
    <button class="tab" data-tab="detail"><i class="ti ti-file-text"></i>Chi tiết testcase</button>

  </div>
  <div class="dtools" id="logTools">
    <select class="select" id="logScope"><option value="case">Case đang xem</option><option value="all">Tất cả bước</option></select>
    <label class="switch"><input type="checkbox" id="follow" checked>Theo dõi</label>
  </div>
  <div id="dbody"></div>
</div>
<div id="modal"></div>
<script>
const $ = s => document.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const api = (p, q) => fetch(p + (q ? "?" + new URLSearchParams(q) : "")).then(r => r.ok ? r.json() : Promise.reject(r.status));
const STATE = {running: "đang chạy", done: "xong", stopped: "đã dừng"};
const VLABEL = {PASS: "PASS", FAIL: "FAIL", BLOCKED: "BLOCKED", "NEED-REVIEW": "CẦN XEM"};
const VCOLOR = {PASS: "cyan", FAIL: "rose", BLOCKED: "gray", "NEED-REVIEW": "amber"};
const VICON = {PASS: "circle-check", FAIL: "circle-x", BLOCKED: "ban", "NEED-REVIEW": "eye"};
const MANUAL = new Set(["screen", "tap", "back", "scroll", "open_app", "goto", "devices", "phone_time"]);

let sel = null, run = null, steps = [], next = 0, tcs = [], focus = null;
const sigs = {};
const prefs = (() => { try { return JSON.parse(localStorage.getItem("monitor") || "{}"); } catch { return {}; } })();
const save = () => { try { localStorage.setItem("monitor", JSON.stringify(prefs)); } catch {} };
const live = ok => { $("#live").className = ok ? "livebox" : "livebox off"; };

// ---- chú Claude: Clawd pixel động (bộ SVG cộng đồng clawd-pet, MIT — xem clawd/SOURCE.txt) ----
// ảnh 45×45 ô (y -25..20), thân Clawd 15×9 ô ở giữa (y 6..15) → hộp .pet ôm đúng thân, chân chạm đáy hộp
const MOODS = ["idle", "walk", "work", "wait", "fix", "fail", "done", "stop"];
function clawd(w) {
  const cw = w * 1.2, s = cw * 3;
  return `<div class="pet" style="width:${cw}px;height:${cw * 9 / 15}px">` + MOODS.map(m =>
    `<img class="${m}" src="/clawd/${m}.svg" alt="" style="width:${s}px;height:${s}px;left:${-cw}px;bottom:${-s * 5 / 45}px">`).join("") + `</div>`;
}
$("#logo").innerHTML = clawd(22);
$("#mAgent").innerHTML = clawd(44) + `<div class="bubble"></div>`;
$("#sAgent").innerHTML = clawd(80) + `<div class="bubble"></div><div class="nametag">CLAUDE</div>`;

// đặt agent: vị trí % trên thanh + tâm trạng; đổi vị trí → đi bộ trong lúc trượt
function place(el, pct, mood, bubble, instant) {
  const prev = el.dataset.pct, key = String(pct.toFixed(2));
  el.classList.remove("hide", "work", "wait", "fail", "fix", "done", "stop", "idle");
  el.classList.add(mood);
  el.classList.toggle("flip", pct > 62);
  if (instant) { el.style.transition = "none"; el.style.left = pct + "%"; el.offsetWidth; el.style.transition = ""; }
  else if (prev !== key) {
    el.classList.add("walk"); clearTimeout(el._t); el._t = setTimeout(() => el.classList.remove("walk"), 950);
    el.style.left = pct + "%";
  }
  el.dataset.pct = key;
  const b = el.querySelector(".bubble");
  if (b.dataset.html !== bubble) { b.innerHTML = bubble; b.dataset.html = bubble; }
  b.style.display = bubble ? "" : "none";
}

// ---- thời gian ----
const T = ts => new Date(String(ts).replace(" ", "T"));
function dur(a, b) {
  if (!a) return "";
  const s = Math.max(0, Math.round(((b ? T(b) : new Date()) - T(a)) / 1000));
  return s >= 3600 ? `${Math.floor(s / 3600)}h${String(Math.floor(s / 60) % 60).padStart(2, "0")}`
       : s >= 60 ? `${Math.floor(s / 60)}p${String(s % 60).padStart(2, "0")}` : `${s}s`;
}
function left(until) {
  const [h, m, s] = String(until).split(":").map(Number), d = new Date(); d.setHours(h, m, s || 0, 0);
  return Math.max(0, Math.round((d - new Date()) / 1000));
}
function tick() {
  $("#clock").textContent = new Date().toLocaleTimeString("vi-VN");
  document.querySelectorAll("[data-since]").forEach(e => e.textContent = dur(e.dataset.since, e.dataset.end || null));
  document.querySelectorAll("[data-until]").forEach(e => e.textContent = left(e.dataset.until) + "s");
}

// ---- dữ liệu suy ra ----
const verdictOf = id => (run?.status?.cases || {})[id];
// case agent đang làm: case của tool đang chạy / đang chờ, không có thì case mở gần nhất
const runningId = () => { const s = run?.status, c = s?.busy?.case || s?.waiting?.case || s?.case?.id; return c ? String(c) : null; };
const isActive = id => !!(run?.status?.active || {})[id] || runningId() === id;
const callsOf = id => steps.filter(s => s.type === "tool" && String(s.case) === id);
const tcOf = id => tcs.find(t => String(t.id) === id) || {id};
function order() {
  const seen = [], add = id => { id = String(id); if (!seen.includes(id)) seen.push(id); };
  steps.forEach(s => s.type === "case_start" && add(s.id));
  Object.keys(run?.status?.cases || {}).forEach(add);
  tcs.forEach(t => add(t.id));
  return seen;
}
// khớp lần lượt các lần gọi tool thật vào bước trong auto.plan (tool cùng tên, nhìn trước tối đa 3 bước);
// gọi lại cùng tool (retry, wait nhiều lần) → gắn vào bước vừa khớp; tool khác (screen/tap… tự lái) → đếm riêng.
// Bước không khớp được lần gọi nào vẽ như bước chưa tới.
function progress(t, calls) {
  const st = (t.auto?.plan || []).map(p => ({label: p.do || p.tool || "", tool: p.tool || null, call: null, n: 0}));
  let i = 0, extra = 0;
  for (const c of calls) {
    let hit = -1;
    for (let k = i; k < st.length && k < i + 3; k++) if (st[k].tool === c.tool) { hit = k; break; }
    if (hit < 0) {
      if (i > 0 && st[i - 1].tool === c.tool) { st[i - 1].call = c; st[i - 1].n++; } else extra++;
      continue;
    }
    st[hit].call = c; st[hit].n = 1; i = hit + 1;
  }
  return {st, done: i, extra};
}
const shortArgs = a => { const s = a && Object.keys(a).length ? JSON.stringify(a) : ""; return s.length > 60 ? s.slice(0, 58) + "…" : s; };
const pctOf = (i, n) => n <= 1 ? 100 : i * 100 / (n - 1);   // trạm cuối (cờ) luôn ở 100%
// trạm hiện tại của agent trên case đang chạy + tâm trạng + lời thoại
function agentState(id, p) {
  const s = run.status || {}, busy = s.busy, waiting = s.waiting, calls = callsOf(id);
  let at = Math.min(p.done, p.st.length);
  if (busy && p.done > 0 && p.st[p.done - 1]?.tool === busy.tool && p.st[p.done]?.tool !== busy.tool) at = p.done - 1;
  const last = calls[calls.length - 1];
  const note = [...steps].reverse().find(x => x.type === "note" && String(x.case) === id);
  let mood = "idle", say;
  if (waiting) {
    mood = "wait";
    say = `⏳ chờ tới ${esc(waiting.until)} · còn <b data-until="${esc(waiting.until)}">${left(waiting.until)}s</b>${waiting.reason ? " — " + esc(waiting.reason) : ""}`;
  } else if (busy && MANUAL.has(busy.tool)) {
    mood = "fix"; say = `🔧 tự lái: <b>${esc(busy.tool)}</b> ${esc(shortArgs(busy.args))} · <span data-since="${esc(busy.since)}"></span>`;
  } else if (busy) {
    mood = "work"; say = `⚙ <b>${esc(busy.tool)}</b> ${esc(shortArgs(busy.args))} · <span data-since="${esc(busy.since)}"></span>`;
  } else if (last && last.status === "failed" && (!note || note.ts <= last.ts)) {
    mood = "fail"; say = `⚠ ${esc(last.tool)} failed — đang xem lỗi…`;
  } else if (note && (!last || note.ts >= last.ts)) {
    say = `💬 ${esc(note.text.length > 90 ? note.text.slice(0, 88) + "…" : note.text)}`;
  } else {
    say = `🤔 đang nghĩ… <span data-since="${esc(last?.ts || s.case?.started || s.updated)}"></span>`;
  }
  return {at, mood, say};
}

// ---- vẽ ----
function vbadge(v, running) {
  if (running) return `<span class="badge b-amber"><span class="dot pulse"></span>Đang chạy</span>`;
  return v ? `<span class="badge b-${VCOLOR[v] || ""}">${esc(VLABEL[v] || v)}</span>` : `<span class="badge">chưa chạy</span>`;
}
function stateBadge(s) {
  const c = {running: "amber", done: "cyan", stopped: "gray"}[s] || "gray";
  return `<span class="badge b-${c}"><span class="dot ${s === "running" ? "pulse" : ""}"></span>${esc(STATE[s] || s || "")}</span>`;
}
function stat(label, icon, value, extra = "") {
  return `<div class="card stat"><div class="k">${label}<i class="ti ti-${icon}"></i></div><div class="v">${value}</div>${extra}</div>`;
}
const quote = (color, icon, title, text) =>
  `<div class="quote b-${color}"><div class="qt"><i class="ti ti-${icon}"></i>${esc(title)}</div>${esc(text)}</div>`;

function renderHud() {
  const st = run.status || {}, cs = st.cases || {}, total = order().length, done = Object.keys(cs).length;
  const cnt = k => Object.values(cs).filter(v => v === k).length, end = st.state !== "running" ? st.updated : null;
  const ag = run.meta?.agent || run.meta?.config?.agent;    // run.yaml: model / effort / session của agent
  const pct = total ? Math.round(done * 100 / total) : 0;
  const title = `<h1>${esc(st.title || "Lượt chạy")} ${stateBadge(st.state)}</h1>
    <div class="sub"><span class="mono">${esc(st.run)} · ${esc((st.session || "").split("/").slice(-3).join("/"))}</span>
      <span><i class="ti ti-calendar"></i>bắt đầu ${esc((st.started || "").slice(11))}</span>
      ${ag ? `<span><i class="ti ti-robot"></i>${esc(ag.model || "?")} · effort ${esc(ag.effort || "?")} · ${esc(String(ag.session_id || "").slice(0, 8))}</span>` : ""}</div>`;
  const stats = stat("Thời gian", "clock", `<span data-since="${esc(st.started)}"${end ? ` data-end="${esc(end)}"` : ""}>${dur(st.started, end)}</span>`)
    + stat("Đã chạy", "player-play", `${done}<small>/ ${total} case</small>`, `<div class="bar"><div style="width:${pct}%"></div></div>`)
    + stat("Pass", "circle-check", cnt("PASS"))
    + stat("Fail", "circle-x", cnt("FAIL"))
    + stat("Blocked", "ban", cnt("BLOCKED"))
    + stat("Cần xem", "eye", cnt("NEED-REVIEW"));
  const summary = st.summary ? quote("gray", "message", "Tóm tắt lượt chạy", st.summary) : "";
  if (sigs.title !== title) { $("#phTitle").innerHTML = title; sigs.title = title; }
  if (sigs.stats !== stats) { $("#stats").innerHTML = stats; sigs.stats = stats; }
  if (sigs.summary !== summary) { $("#summary").innerHTML = summary; sigs.summary = summary; }

function renderMission() {
  const ids = order(), n = ids.length + 1, cur = runningId(), st = run.status || {};
  const pos = i => pctOf(i, n);
  const rail = $("#mission .rail"), gap = rail.clientWidth / Math.max(1, n - 1);
  const k = Math.max(1, Math.ceil(46 / gap));
  rail.classList.toggle("dense", gap < 17);
  rail.style.setProperty("--sw", Math.max(2, gap - 1.5).toFixed(1) + "px");
  // nhãn định kỳ sát nhãn case đang chạy / đang xem thì bỏ (khỏi đè chữ)
  const pin = [ids.indexOf(cur), ids.indexOf(focus), ids.length].filter(j => j >= 0), near = i => pin.some(j => j !== i && Math.abs(i - j) < k);
  const html = ids.map((id, i) => {
    const v = verdictOf(id), c = cur === id;
    return `<div class="stn ${esc(v || "")} ${c || isActive(id) ? "cur" : ""} ${focus === id ? "focus" : ""}" data-id="${esc(id)}"
      style="left:${pos(i)}%" title="${esc(id)} · ${esc(tcOf(id).title || "")}${v ? " — " + esc(VLABEL[v] || v) : ""}"></div>
      ${(i % k === 0 && !near(i)) || c || focus === id ? `<div class="lbl ${c ? "cur" : ""}" style="left:${pos(i)}%">${esc(id)}</div>` : ""}`;
  }).join("") + `<div class="stn flag ${st.state === "done" ? "PASS" : ""}" style="left:100%" title="Kết thúc lượt"></div>
    <div class="lbl" style="left:100%">🏁</div>`;
  if (sigs.mission !== html) { $("#mStations").innerHTML = html; sigs.mission = html; }
  $("#missionInfo").textContent = `${Object.keys(st.cases || {}).length}/${ids.length} case`;
  let at, mood = "idle", say;
  if (cur) {
    at = ids.indexOf(cur);
    mood = st.waiting ? "wait" : st.busy ? (MANUAL.has(st.busy.tool) ? "fix" : "work") : "idle";
    say = `${esc(cur)} · ${esc(st.busy?.tool || (st.waiting ? "chờ" : "đang nghĩ"))}`;
  } else if (st.state === "done") { at = n - 1; mood = "done"; say = "xong lượt chạy 🎉"; }
  else if (st.state === "stopped") { at = Math.max(0, ids.findIndex(id => !verdictOf(id))); mood = "stop"; say = "đã dừng"; }
  else { at = ids.findIndex(id => !verdictOf(id)); if (at < 0) at = n - 1; say = "chuẩn bị case kế"; }
  $("#mFill").style.width = pos(at) + "%";
  place($("#mAgent"), pos(at), mood, say, sigs.mRun !== sel.run);
  sigs.mRun = sel.run;
}

const RES = {power: "bật/tắt", quick: "hẹn giờ nhanh", cycle: "tuần hoàn", timers: "DS hẹn giờ", lock: "khoá", press: "nhấn nhả",
  inputs: "đầu vào", room: "phòng", name: "tên", neo: "NeoR6"};
const hm = ms => new Date(ms).toTimeString().slice(0, 5);
function todayAt(hms) { const [h, m, s] = String(hms).split(":").map(Number), d = new Date(); d.setHours(h, m, s || 0, 0); return d.getTime(); }
// trạng thái ngắn của 1 case ở cột trái: đang chạy tool / đang chờ / bước cuối
function parStatus(id, st) {
  if (st.waiting && String(st.waiting.case) === id)
    return `<div class="l2 wait" title="chờ tới ${esc(st.waiting.until)}${st.waiting.reason ? " — " + esc(st.waiting.reason) : ""}"><i class="ti ti-hourglass"></i>chờ · còn
      <b data-until="${esc(st.waiting.until)}">${left(st.waiting.until)}s</b></div>`;
  if (st.busy && String(st.busy.case) === id)
    return `<div class="l2 busy" title="${esc(shortArgs(st.busy.args))}"><i class="ti ti-loader-2"></i><b>${esc(st.busy.tool)}</b></div>`;
  const calls = callsOf(id), last = calls[calls.length - 1];
  if (!last) return `<div class="l2"><i class="ti ti-point"></i>chưa có bước</div>`;
  return `<div class="l2 ${last.status === "failed" ? "fail" : ""}"><i class="ti ti-${last.status === "failed" ? "alert-triangle" : "check"}"></i>
    <b>${esc(last.tool)}</b> · <span data-since="${esc(last.ts)}"></span> trước</div>`;
}
function renderPar() {
  const act = run.status?.active || {}, ids = Object.keys(act), st = run.status || {};
  $("#par").classList.toggle("hide", !ids.length);
  if (!ids.length) { if (sigs.par) { $("#parBody").innerHTML = ""; sigs.par = ""; } return; }
  const ms = x => T(x).getTime(), now = Math.floor(Date.now() / 5e3) * 5e3;     // làm tròn 5 s: đỡ vẽ lại liên tục
  const wait = st.waiting?.until ? todayAt(st.waiting.until) : null;
  let lo = now - 60e3, hi = now + 2 * 60e3;
  for (const id of ids) {
    lo = Math.min(lo, ms(act[id].started));
    for (const c of act[id].claims) { lo = Math.min(lo, ms(c.from)); if (c.to) hi = Math.max(hi, ms(c.to)); }
  }
  if (wait) hi = Math.max(hi, wait);
  lo -= 20e3; hi += 40e3;
  const X = t => Math.max(0, Math.min(100, (t - lo) * 100 / (hi - lo))), P = t => X(t).toFixed(2) + "%";
  const step = [1, 2, 5, 10, 15, 30, 60].find(m => (hi - lo) / (m * 60e3) <= 9) * 60e3;
  let ticks = "", grid = "";
  const cw = $("#parBody").clientWidth, W = Math.max(200, cw - 36 - Math.max(150, (cw - 36) * 0.21) - 12 - 40);    // bề rộng trục (px)
  for (let t = Math.ceil(lo / step) * step; t <= hi; t += step) {
    if (Math.abs(X(t) - X(now)) / 100 * W > 46) ticks += `<span class="ptick" style="left:${P(t)}">${hm(t)}</span>`;
    grid += `<div class="pgl" style="left:${P(t)}"></div>`;
  }
  const lanes = ids.map(id => {
    const a = act[id], cur = runningId() === id;
    // chữ chỉ nằm trong khung: đủ chỗ → "tên giờ–giờ"; hẹp → giờ rút gọn; hẹp nữa → trống (tooltip; màu = tài nguyên ở chú thích)
    const cl = [...a.claims].sort((p, q) => ms(p.from) - ms(q.from)), px = t => X(t) / 100 * W;
    // khung chồng giờ nhau → hàng con riêng (xếp tham lam: hàng đầu tiên đã trống tới lúc khung bắt đầu)
    const ends = [], row = cl.map(c => { let r = ends.findIndex(e => e <= ms(c.from)); if (r < 0) r = ends.push(0) - 1;
      ends[r] = c.to ? ms(c.to) : Infinity; return r; });
    const nr = Math.max(1, ends.length);
    const bars = cl.map((c, i) => {
      const f = ms(c.from), t = c.to ? ms(c.to) : hi, live = f <= now && now < t, name = RES[c.res] || c.res;
      const span = `${c.from.slice(11, 16)}–${c.to ? c.to.slice(11, 16) : "hết case"}`;
      const short = `${c.from.slice(11, 16)}–${!c.to ? "…" : c.to.slice(11, 13) === c.from.slice(11, 13) ? c.to.slice(14, 16) : c.to.slice(11, 16)}`;
      const lab = `${esc(name)}<small>${esc(span)}</small>`, need = (name.length + span.length) * 6.8 + 26;
      const wpx = px(t) - px(f), top = `top:${10 + row[i] * 28}px;`;
      const inner = wpx >= need ? lab : wpx >= short.length * 6.6 + 12 ? `<small>${esc(short)}</small>` : "";
      return `<div class="pbar r-${esc(c.res)} ${c.to ? "" : "open"} ${live ? "live" : ""} ${inner && inner !== lab ? "sm" : ""}" style="${top}left:${P(f)};width:${(X(t) - X(f)).toFixed(2)}%"
        title="${esc(name)} · ${esc(span)}${live ? " · đang giữ" : ""}">${inner}</div>`;
    }).join("");
    const s0 = ms(a.started);
    const w = wait && String(st.waiting.case) === id ? `<div class="pwl" style="left:${P(now)};width:${(X(wait) - X(now)).toFixed(2)}%"></div>
      <div class="pfl" style="left:${P(wait)}" title="chờ tới ${esc(st.waiting.until)}"><i class="ti ti-hourglass"></i></div>` : "";
    const busy = st.busy && !st.waiting && String(st.busy.case) === id ? `<div class="pbusy" style="left:${P(now)}" title="${esc(st.busy.tool)}"></div>` : "";
    return `<div class="plab ${cur ? "cur" : ""}" data-id="${esc(id)}"><div class="l1"><span class="id">${esc(id)}</span>
        <span class="t" title="${esc(tcOf(id).title || a.title || "")}">${esc(tcOf(id).title || a.title || "")}</span></div>${parStatus(id, st)}</div>
      <div class="plane" data-id="${esc(id)}" style="min-height:${62 + (nr - 1) * 28}px"><div class="pin" style="--y:${47 + (nr - 1) * 28}px">${bars}<div class="plife" style="left:${P(s0)};width:${(X(now) - X(s0)).toFixed(2)}%"></div>
        ${w}${busy}</div></div>`;
  }).join("");
  const loose = st.waiting && !ids.includes(String(st.waiting.case))
      ? `<div class="pfoot"><i class="ti ti-hourglass"></i>chờ tới <b class="mono">${esc(st.waiting.until)}</b>${st.waiting.reason ? " — " + esc(st.waiting.reason) : ""}</div>`
    : st.busy && !st.waiting && !ids.includes(String(st.busy.case))
      ? `<div class="pfoot"><i class="ti ti-tool"></i><b>${esc(st.busy.tool)}</b>${st.busy.case ? ` (case ${esc(st.busy.case)})` : " (không gắn case)"}</div>` : "";
  const html = `<div class="pgrid" style="grid-template-rows:24px repeat(${ids.length}, auto)">
      <div class="pov"><div class="pin"><div class="ppast" style="width:${P(now)}"></div>${grid}</div></div>
      <div class="phd">case</div><div class="pax"><div class="pin">${ticks}</div></div>${lanes}
      <div class="pov top"><div class="pin"><div class="pnow" style="left:${P(now)}"></div><span class="pnowl" style="left:${P(now)}">bây giờ</span></div></div>
    </div>${loose}`;
  if (sigs.par !== html) { $("#parBody").innerHTML = html; sigs.par = html; tick(); }
  const used = [...new Set(ids.flatMap(id => act[id].claims.map(c => c.res)))];
  const info = `<span class="plg">${used.map(r => `<span class="r-${esc(r)}"><i class="sw"></i>${esc(RES[r] || r)}</span>`).join("")}
<span><i class="pwk"></i>đang chờ</span><span>${ids.length} case đang mở</span></span>`;
  if (sigs.parInfo !== info) { $("#parInfo").innerHTML = info; sigs.parInfo = info; }
}

function stageCase() { return focus || runningId() || [...order()].reverse().find(id => verdictOf(id)) || order()[0]; }

function renderStage() {
  const id = stageCase();
  if (!id) return;
  const t = tcOf(id), calls = callsOf(id), p = progress(t, calls), running = runningId() === id;
  const v = verdictOf(id), res = run.cases?.[id], n = p.st.length + 1;
  const ag = running ? agentState(id, p) : null;
  const head = `<div class="stagehead"><span class="id">${esc(id)}</span><span class="t">${esc(t.title || "")}</span>
      ${vbadge(v, isActive(id))}${t.group ? `<span class="badge">${esc(t.group)}</span>` : ""}
      ${running && run.status.case?.started ? `<span class="muted mono"><i class="ti ti-clock"></i> <span data-since="${esc(run.status.case.started)}"></span></span>` : ""}

  const stations = p.st.map((s, i) => {

    return `<div class="stn ${cls}" style="left:${pctOf(i, n)}%" title="${esc(s.label)}">${i + 1}</div>

  const failed = calls.filter(c => c.status === "failed").length, evts = calls.flatMap(c => c.events || []);

      ${failed ? `<span class="bad"><i class="ti ti-circle-x"></i>${failed} lần failed</span>` : ""}
      ${evts.length ? `<span class="evt"><i class="ti ti-alert-triangle"></i>${esc(evts[evts.length - 1])}</span>` : ""}</div>

  if (sigs.sSt !== stations) { $("#sStations").innerHTML = stations; sigs.sSt = stations; }
  if (sigs.sFoot !== foot) { $("#sFoot").innerHTML = foot; sigs.sFoot = foot; }
  $("#stage .rail").classList.toggle("noagent", !running);
  const rw = $("#stage .rail").clientWidth;               // nhãn co theo khoảng cách trạm (panel mở → thanh hẹp)
  $("#sStations").style.setProperty("--lw", Math.max(64, Math.min(132, rw / Math.max(1, n - 1) - 10)) + "px");
  const fillTo = running ? ag.at : (v ? n - 1 : p.done);
  $("#sFill").style.width = pctOf(Math.min(fillTo, n - 1), n) + "%";
  const agent = $("#sAgent"), key = sel.run + "|" + id;
  if (running) place(agent, pctOf(Math.min(ag.at, n - 1), n), ag.mood, ag.say, sigs.sCase !== key);

function renderGrid() {

      http.length && mqtt.length ? "\n" : ""}${mqtt.map(m => `${esc(m.ts.slice(11))} ${esc(m.dir)} ${esc(m.device || m.topic || "")} ${m.msg ? esc(J(m.msg)) : ""}`).join("\n")}</div></details>` : ""}

}
function openDrawer(tab, toggle = true) {
  prefs.drawer = toggle && prefs.drawer && prefs.tab === tab ? false : true;
  prefs.tab = tab; save();
  document.body.classList.toggle("drawer", prefs.drawer);
  renderDrawer(true); setTimeout(render, 320);
}
function render() {
  if (!run) return;
  renderHud(); renderMission(); renderPar(); renderStage(); renderGrid(); renderDrawer(); tick();
}

// ---- sidebar: phiên / lượt chạy ----
async function loadTree() {
  let t;
  try { t = await api("/api/tree"); $("#root").textContent = t.root; live(true); } catch { live(false); return; }
  let h = "";
  for (const s of t.suites) {
    h += `<div class="grp"><i class="ti ti-folder"></i>${esc(s.suite)}</div>`;
    for (const d of s.sessions) for (const dev of d.devices) {
      // bỏ phiên chưa chạy + lượt dừng mà chưa xong case nào (không có kết quả)
      const runs = dev.runs.filter(r => r.state !== "stopped" || Object.keys(r.cases || {}).length);
      if (!runs.length) continue;
      const day = /^\d{6}$/.test(d.date) ? `${d.date.slice(4)}/${d.date.slice(2, 4)}/20${d.date.slice(0, 2)}` : d.date;
      h += `<div class="dev">${esc(day)}${dev.name !== s.suite ? " · " + esc(dev.name) : ""}</div>`;
      for (const r of runs) {
        const vs = Object.values(r.cases || {}), pass = vs.filter(v => v === "PASS").length;
        h += `<div class="nav run ${sel && sel.run === r.dir ? "active" : ""}" data-run="${esc(r.dir)}" data-tc="${esc(dev.testcases)}"
          title="${esc(r.run)} · ${esc(dev.name)} · ${esc(STATE[r.state] || r.state)} · ${pass}/${vs.length} pass">
          <i class="ti ti-player-play s-${esc(r.state)}"></i><span class="mono">${esc(r.run)}</span>${stateBadge(r.state)}<span class="r">${pass}/${vs.length}</span></div>`;
      }
    }
  }
  h = h || `<div class="empty">Chưa có phiên nào</div>`;
  if (sigs.tree !== h) { $("#tree").innerHTML = h; sigs.tree = h; }
  if (!sel) {   // mở trang: lượt đang chạy trước, không có thì lượt đầu
    const first = document.querySelector(".run[data-run] i.s-running")?.closest(".run") || document.querySelector(".run[data-run]");
    if (first) pick(first.dataset.run, first.dataset.tc);
  }
}
async function pick(dir, tcDir) {
  sel = {run: dir, tc: tcDir}; steps = []; next = 0; focus = null; run = null;
  for (const k of Object.keys(sigs)) if (k !== "tree") delete sigs[k];
  document.querySelectorAll(".run").forEach(x => x.classList.toggle("active", x.dataset.run === dir));
  tcs = await api("/api/testcases", {dir: tcDir}).catch(() => []);
  await poll();
}
async function poll() {
  if (!sel) return;
  try {
    run = await api("/api/run", {dir: sel.run});
    const r = await api("/api/steps", {dir: sel.run, from: next});
    if (r.steps.length) { steps.push(...r.steps); next = r.next; }
    render(); live(true);
  } catch { live(false); }
}

// ---- sự kiện ----
function setFocus(id) { focus = focus === id ? null : id; render(); }
$("#tree").addEventListener("click", e => { const r = e.target.closest(".run[data-run]"); if (r) pick(r.dataset.run, r.dataset.tc); });
$("#mStations").addEventListener("click", e => { const s = e.target.closest(".stn[data-id]"); if (s) setFocus(s.dataset.id); });
$("#grid").addEventListener("click", e => { const c = e.target.closest(".tc"); if (c) setFocus(c.dataset.id); });
$("#parBody").addEventListener("click", e => { const r = e.target.closest(".plab, .plane"); if (r) setFocus(r.dataset.id); });
$("#sHead").addEventListener("click", e => { if (e.target.closest("#followRun")) { focus = null; render(); } });
function applySide() {
  document.body.classList.toggle("collapsed", !!prefs.collapsed);
  $("#sideBtn i").className = "ti ti-layout-sidebar-left-" + (prefs.collapsed ? "expand" : "collapse");
  $("#sideBtn").title = prefs.collapsed ? "Mở rộng" : "Thu gọn";
}
$("#sideBtn").onclick = () => { prefs.collapsed = !prefs.collapsed; save(); applySide(); setTimeout(render, 220); };
$("#detailBtn").onclick = () => openDrawer("detail");
$("#logBtn").onclick = () => openDrawer("log");
$("#stageDetail").onclick = () => openDrawer("detail", false);
$("#stageLog").onclick = () => { $("#logScope").value = "case"; openDrawer("log", false); };
document.querySelectorAll(".tab").forEach(b => b.onclick = () => { prefs.tab = b.dataset.tab; save(); renderDrawer(true); });
$("#closeDrawer").onclick = () => { prefs.drawer = false; save(); document.body.classList.remove("drawer"); renderDrawer(); setTimeout(render, 320); };
window.addEventListener("resize", () => render());
$("#logScope").onchange = () => renderDrawer(true);
$("#dbody").addEventListener("click", e => {
  const img = e.target.closest(".shot img"); if (!img) return;
  $("#modal").innerHTML = `<img src="${img.src}">`; $("#modal").style.display = "flex";
});
$("#reportBtn").onclick = () => {
  $("#modal").innerHTML = `<pre>${esc(run?.report || "Chưa có báo cáo (agent ghi khi kết thúc lượt chạy).")}</pre>`;
  $("#modal").style.display = "flex";
};
$("#modal").onclick = () => { $("#modal").style.display = "none"; };

applySide();
document.body.classList.toggle("drawer", !!prefs.drawer);
renderDrawer();
setInterval(tick, 1000); setInterval(poll, 1500); setInterval(loadTree, 5000);
tick(); loadTree();
</script>
</body>
</html>
